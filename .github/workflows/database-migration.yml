name: Database migration
on:
  push:
    branches: [main]
    paths:
      - 'src/database/**'
      - 'src/migration/**'
      - 'src/storage/portable-mount-contract.js'
      - 'tools/ci/initialize-native-instance.ps1'
      - 'tools/ci/supply-current-sqlite.ps1'
      - 'tools/ci/build-native.ps1'
      - 'tools/validation/native-build-inputs.js'
      - 'tests/migration/emby-exchange.test.js'
      - 'tests/migration/database-cli.test.js'
      - 'tests/migration/jellyfin-generations.test.js'
      - 'tests/helpers/library-exchange-media-proxy.js'
      - 'tools/database/**'
      - 'tools/jellyfin/EmbyChapterMarkers/**'
      - 'src/library/media-segment-service.js'
      - 'src/media-execution/segment-analysis.js'
      - 'plugins/skip-segments/**'
      - 'tests/migration/skip-segments.test.js'
      - 'tools/ci/*migration*'
      - 'tools/ci/fetch-emby-server.ps1'
      - 'tests/fixtures/jellyfin-reference/**'
      - '.github/workflows/database-migration.yml'
  pull_request:
    paths:
      - 'src/database/**'
      - 'src/migration/**'
      - 'src/storage/portable-mount-contract.js'
      - 'tools/ci/initialize-native-instance.ps1'
      - 'tools/ci/supply-current-sqlite.ps1'
      - 'tools/ci/build-native.ps1'
      - 'tools/validation/native-build-inputs.js'
      - 'tests/migration/emby-exchange.test.js'
      - 'tests/migration/database-cli.test.js'
      - 'tests/migration/jellyfin-generations.test.js'
      - 'tests/helpers/library-exchange-media-proxy.js'
      - 'tools/database/**'
      - 'tools/jellyfin/EmbyChapterMarkers/**'
      - 'src/library/media-segment-service.js'
      - 'src/media-execution/segment-analysis.js'
      - 'plugins/skip-segments/**'
      - 'tests/migration/skip-segments.test.js'
      - 'tools/ci/*migration*'
      - 'tools/ci/fetch-emby-server.ps1'
      - 'tests/fixtures/jellyfin-reference/**'
      - '.github/workflows/database-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emby-inputs:
    name: Freeze official Emby inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse the immutable selection on a rerun
        id: previous
        if: github.run_attempt != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "emby-migration-inputs" and (.expired | not)) | .id')
          if [[ -n "$artifact" ]]; then
            gh run download "$GITHUB_RUN_ID" --name emby-migration-inputs --dir "$RUNNER_TEMP"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select the latest public and fixed releases
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/fetch-emby-server.ps1 -FreezeMigrationInputs (Join-Path $env:RUNNER_TEMP 'emby-migration-inputs.json')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.previous.outputs.found != 'true'
        with:
          name: emby-migration-inputs
          path: ${{ runner.temp }}/emby-migration-inputs.json
          if-no-files-found: error
          retention-days: 30
  emby:
    name: Emby / ${{ matrix.channel }}
    needs: emby-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: ['4.9.1.0', latest]
    env:
      DOTNET_NOLOGO: '1'
      MEDIAMANAGER_TEST_POSTGRES: postgresql://validation@127.0.0.1:5432/postgres
      MEDIAMANAGER_EMBY_INPUTS: ${{ needs.emby-inputs.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.426
      - uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca
        with:
          postgres-version: '17'
          user: validation
      - run: npm ci --bin-links=false
      - name: Prepare official server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/fetch-emby-server.ps1 -Channel '${{ matrix.channel }}'
      - name: Supply the second server for both cross-version directions
        if: matrix.channel == 'latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/ci/fetch-emby-server.ps1 -Channel '4.9.1.0' -Alternate
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'mediamanager-emby-alternate/receipts/reference-input.json') `
            -Destination (Join-Path $env:RUNNER_TEMP 'mediamanager-emby-reference/receipts/alternate-reference-input.json')
      - name: Prepare official media tools
        shell: pwsh
        env:
          MEDIAMANAGER_VALIDATION_OUTPUT_ROOT: ${{ runner.temp }}/mediamanager-emby-reference/receipts
          MEDIAMANAGER_RELEASE_ASSET_TOKEN: ${{ github.token }}
        run: ./tools/ci/setup-media.ps1
      - run: node --test tests/migration/emby-exchange.test.js tests/migration/skip-segments.test.js
      - run: node tools/ci/verify-fingerprint-migration.mjs
      - run: node tools/ci/verify-emby-migration.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: emby-${{ matrix.channel }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mediamanager-emby-reference/receipts/
          retention-days: 14
  jellyfin:
    name: Jellyfin / previous, fresh and upgraded databases
    needs: emby-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MEDIAMANAGER_TEST_POSTGRES: postgresql://validation@127.0.0.1:5432/postgres
      MEDIAMANAGER_EMBY_INPUTS: ${{ needs.emby-inputs.outputs.selection }}
      MEDIAMANAGER_CI_NATIVE_REFERENCE: 'true'
      MEDIAMANAGER_CI_NATIVE_INSTANCE: 'true'
      MEDIAMANAGER_CI_NATIVE_SQLITE: 'true'
      MEDIAMANAGER_CI_MATRIX_OS: ubuntu-24.04
      MEDIAMANAGER_CI_SHARD: '1'
      MEDIAMANAGER_CI_SHARDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
      - name: Bind the checkout and isolated SDK paths
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/mediamanager-dotnet" >> "$GITHUB_ENV"
          echo "MEDIAMANAGER_CHECKOUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MEDIAMANAGER_CHECKOUT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.426
            10.0.401
      - name: Verify isolated .NET installation
        shell: pwsh
        run: ./tools/ci/verify-dotnet.ps1
      - name: Build and verify the current designated reference
        shell: pwsh
        run: |
          ./tools/ci/build-native.ps1
          $env:MEDIAMANAGER_NATIVE_BUILD_ROOT = Join-Path $env:RUNNER_TEMP 'mediamanager-native-build'
          $env:MEDIAMANAGER_JELLYFIN_DLL = Join-Path $env:MEDIAMANAGER_NATIVE_BUILD_ROOT 'runtime/jellyfin.dll'
          node --input-type=module --eval "const { verifyNativeBuild } = await import('./tools/validation/native-build-inputs.js'); await verifyNativeBuild();"
          if ($LASTEXITCODE -ne 0) { throw 'Current native build verification failed.' }
          "MEDIAMANAGER_NATIVE_BUILD_ROOT=$env:MEDIAMANAGER_NATIVE_BUILD_ROOT" >> $env:GITHUB_ENV
          "MEDIAMANAGER_JELLYFIN_DLL=$env:MEDIAMANAGER_JELLYFIN_DLL" >> $env:GITHUB_ENV
      - uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca
        with:
          postgres-version: '17'
          user: validation
      - run: npm ci --bin-links=false
      - name: Prepare official media tools
        shell: pwsh
        env:
          MEDIAMANAGER_VALIDATION_OUTPUT_ROOT: ${{ runner.temp }}/results
          MEDIAMANAGER_RELEASE_ASSET_TOKEN: ${{ github.token }}
        run: ./tools/ci/setup-media.ps1
      - name: Prepare both official Emby servers for the native-to-native return
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/ci/fetch-emby-server.ps1 -Channel latest
          ./tools/ci/fetch-emby-server.ps1 -Channel '4.9.1.0' -Alternate
      - name: Initialize isolated native instance and controlled media seed
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/ci/initialize-native-instance.ps1
      - name: Supply current stopped-instance SQLite input
        shell: pwsh
        timeout-minutes: 5
        run: ./tools/ci/supply-current-sqlite.ps1
      - name: Verify the current SQLite CLI roundtrip and migration tests
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MEDIAMANAGER_TEST_CURRENT_NATIVE_SQLITE"
          mkdir -p "$RUNNER_TEMP/results"
          cp "$RUNNER_TEMP/mediamanager-current-sqlite/input/receipt.json" "$RUNNER_TEMP/results/current-sqlite.json"
          tap="$RUNNER_TEMP/results/database-cli.tap"
          node --test --test-reporter=tap tests/migration/database-cli.test.js tests/migration/jellyfin-generations.test.js | tee "$tap"
          grep -Eq '^ok [0-9]+ - real CLI roundtrip preserves the current native SQLite source in PostgreSQL$' "$tap"
          grep -Fxq '# skipped 0' "$tap"
      - name: Build the previous reference and exchange stopped databases across generations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/builds" "$RUNNER_TEMP/results"
          echo '{"sdk":{"version":"10.0.401","rollForward":"disable"}}' > "$RUNNER_TEMP/builds/global.json"
          cp "$MEDIAMANAGER_EMBY_REFERENCE_ROOT/receipts/reference-input.json" "$RUNNER_TEMP/results/emby-latest-reference-input.json"
          cp "$MEDIAMANAGER_EMBY_ALTERNATE_ROOT/receipts/reference-input.json" "$RUNNER_TEMP/results/emby-fixed-reference-input.json"
          ref=tests/fixtures/recorded-native
          archive=$(jq -r .archive.path "$ref/jellyfin-source-package.json")
          sha=$(jq -r .archive.sha256 "$ref/jellyfin-source-package.json")
          echo "$sha  $ref/$archive" | sha256sum --check
          dir="$RUNNER_TEMP/builds/recorded-native"
          unzip -q "$ref/$archive" -d "$dir"
          (cd "$RUNNER_TEMP/builds" && dotnet build "$dir/jellyfin-source/Jellyfin.Server/Jellyfin.Server.csproj" -c Release --verbosity quiet)
          previous="$dir/jellyfin-source/Jellyfin.Server/bin/Release/net10.0/jellyfin.dll"
          export MEDIAMANAGER_MARKER_PLUGIN="$RUNNER_TEMP/marker-reader/MediaManager.EmbyChapterMarkers.dll"
          dotnet build tools/jellyfin/EmbyChapterMarkers/EmbyChapterMarkers.csproj -c Release \
            -p:JellyfinBin="$(dirname "$MEDIAMANAGER_JELLYFIN_DLL")" -o "$(dirname "$MEDIAMANAGER_MARKER_PLUGIN")"
          export MEDIAMANAGER_SKIPPER_ZIP="$RUNNER_TEMP/intro-skipper-v12.0.7.0.zip"
          gh api -H 'Accept: application/octet-stream' repos/intro-skipper/intro-skipper/releases/assets/775285725 > "$MEDIAMANAGER_SKIPPER_ZIP"
          echo "3c72de01810910cabb25c0f2d6090b6bb2c391e3b333d69f04de338dfa4edf06  $MEDIAMANAGER_SKIPPER_ZIP" | sha256sum --check
          python tools/ci/verify-jellyfin-migration.py "$previous" "$MEDIAMANAGER_JELLYFIN_DLL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jellyfin-emby-chapter-markers-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/marker-reader/MediaManager.EmbyChapterMarkers.dll
            ${{ runner.temp }}/marker-reader/meta.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jellyfin-migration-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          retention-days: 14
