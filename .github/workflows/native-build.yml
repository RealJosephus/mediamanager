name: Build native reference runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native reference / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Verify source and build isolated reference runtime
        shell: pwsh
        run: ./tools/ci/build-native.ps1
      - name: Preserve runtime, source offer and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-reference-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mediamanager-native-build/runtime
            ${{ runner.temp }}/mediamanager-native-build/source-offer
            ${{ runner.temp }}/mediamanager-native-build/receipts
          if-no-files-found: error
          retention-days: 14
