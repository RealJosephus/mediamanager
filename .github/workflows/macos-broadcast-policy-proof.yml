name: macOS limited-broadcast policy proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-broadcast-policy-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    name: Ordinary UID broadcast / private PF owner / actual packet evidence
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - name: Check out the exact proof candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the designated Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Allocate the separate create-only evidence root
        shell: bash
        run: |
          set -euo pipefail
          printf 'MEDIAMANAGER_POLICY_PROOF_ROOT=%s\n' "$RUNNER_TEMP/mediamanager-policy-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Prove actual ordinary UID packets and owned policy release
        run: node tools/ci/macos-broadcast-policy-proof.js
      - name: Preserve all original proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-broadcast-policy-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MEDIAMANAGER_POLICY_PROOF_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
