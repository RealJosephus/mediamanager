name: Build complete HarfBuzz WASM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up runtime for generated module verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - name: Build pinned upstream shaping engine
        run: python3 tools/ci/build-harfbuzz.py
      - name: Preserve runtime, sources and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harfbuzz-complete-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mediamanager-harfbuzz-build/artifact
          if-no-files-found: error
          retention-days: 30
